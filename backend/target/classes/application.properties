# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=appzys-ecommerce-backend

# ========================================================
# Real MySQL Database Configuration (Connected to your MySQL Workbench)
# ========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/appzys_ecommerce?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=12345V
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Automatically creates all tables in MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata

